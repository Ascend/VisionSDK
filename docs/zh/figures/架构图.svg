<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8faff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#eef2ff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="stage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowSm" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <clipPath id="round-corner">
      <rect width="960" height="550" rx="16"/>
    </clipPath>
  </defs>

  <rect width="960" height="550" rx="16" fill="url(#bg)"/>

  <rect x="0" y="0" width="960" height="52" fill="url(#header)" clip-path="url(#round-corner)"/>

  <g transform="translate(307, 26)">
    <circle cx="0" cy="0" r="11" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <polygon points="3,-9 -5,1 1,1 -3,9 5,-1 -1,-1" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <text x="333" y="34" text-anchor="start" fill="white" font-size="18" font-weight="bold">Vision SDK 图片与视频处理加速架构全景图</text>

  <line x1="652" y1="72" x2="652" y2="504" stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.5"/>

  <rect x="16" y="72" width="628" height="36" rx="8" fill="url(#stage)" filter="url(#shadow)"/>
  <text x="330" y="96" text-anchor="middle" fill="white" font-size="14" font-weight="bold">mxStream</text>

  <rect x="20" y="116" width="308" height="52" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="174" y="138" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">StreamManager</text>
  <text x="174" y="156" text-anchor="middle" fill="#64748b" font-size="11">Stream 构建和销毁 / 数据收发接口</text>

  <rect x="336" y="116" width="308" height="52" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="138" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">StreamServer</text>
  <text x="490" y="156" text-anchor="middle" fill="#64748b" font-size="11">推理服务器 / RESTful 视觉推理服务</text>

  <line x1="16" y1="178" x2="644" y2="178" stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.5"/>

  <rect x="16" y="184" width="628" height="36" rx="8" fill="url(#stage)" filter="url(#shadow)"/>
  <text x="330" y="208" text-anchor="middle" fill="white" font-size="14" font-weight="bold">mxPlugins</text>

  <rect x="20" y="228" width="308" height="52" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="174" y="250" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">MpDataSource</text>
  <text x="174" y="268" text-anchor="middle" fill="#64748b" font-size="11">拉流 / 数据加载 / 序列化 / 导出</text>

  <rect x="336" y="228" width="308" height="52" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="250" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">MpDataProcess</text>
  <text x="490" y="268" text-anchor="middle" fill="#64748b" font-size="11">视频图像编解码 / 抠图缩放贴图旋转</text>

  <rect x="20" y="288" width="308" height="44" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="174" y="306" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">MpModelInfer</text>
  <text x="174" y="322" text-anchor="middle" fill="#64748b" font-size="11">模型推理相关功能</text>

  <rect x="336" y="288" width="308" height="44" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="306" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">MpPostProc</text>
  <text x="490" y="322" text-anchor="middle" fill="#64748b" font-size="11">模型后处理相关功能</text>

  <line x1="16" y1="342" x2="644" y2="342" stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.5"/>

  <rect x="16" y="348" width="628" height="36" rx="8" fill="url(#stage)" filter="url(#shadow)"/>
  <text x="330" y="372" text-anchor="middle" fill="white" font-size="14" font-weight="bold">mxBase</text>

  <rect x="20" y="392" width="308" height="52" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="174" y="414" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">MbCV</text>
  <text x="174" y="432" text-anchor="middle" fill="#64748b" font-size="11">抠图缩放 / 通道拼接拆分</text>

  <rect x="336" y="392" width="308" height="52" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="414" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">ModelInfer</text>
  <text x="490" y="432" text-anchor="middle" fill="#64748b" font-size="11">模型推理 / 模型后处理</text>

  <rect x="20" y="452" width="308" height="52" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="174" y="474" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Basic Algorithm</text>
  <text x="174" y="492" text-anchor="middle" fill="#64748b" font-size="11">NMS / 仿射变换 / 匈牙利 / 卡尔曼</text>

  <rect x="336" y="452" width="308" height="52" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="474" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Resource Manager</text>
  <text x="490" y="492" text-anchor="middle" fill="#64748b" font-size="11">资源管理 / 异步流程 / 设备内存</text>

  <rect x="664" y="72" width="280" height="36" rx="8" fill="url(#stage)" filter="url(#shadow)"/>
  <text x="804" y="96" text-anchor="middle" fill="white" font-size="14" font-weight="bold">mxTools</text>

  <rect x="664" y="116" width="280" height="52" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="804" y="138" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">PluginToolkit</text>
  <text x="804" y="156" text-anchor="middle" fill="#64748b" font-size="11">插件开发 API</text>

  <rect x="664" y="176" width="280" height="64" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="804" y="198" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">SdkInfoCollector</text>
  <text x="804" y="216" text-anchor="middle" fill="#64748b" font-size="11">一键式信息收集</text>
  <text x="804" y="232" text-anchor="middle" fill="#64748b" font-size="11">日志与资源占用率收集</text>

  <rect x="664" y="248" width="280" height="52" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="804" y="270" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Uninstaller</text>
  <text x="804" y="288" text-anchor="middle" fill="#64748b" font-size="11">Vision SDK 卸载工具</text>

  <rect x="664" y="308" width="280" height="52" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="804" y="330" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">TestToolkit</text>
  <text x="804" y="348" text-anchor="middle" fill="#64748b" font-size="11">单插件测试工具</text>

  <rect x="664" y="368" width="280" height="64" rx="8" fill="white" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="804" y="390" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">PluginInspector</text>
  <text x="804" y="408" text-anchor="middle" fill="#64748b" font-size="11">插件信息收集</text>
  <text x="804" y="424" text-anchor="middle" fill="#64748b" font-size="11">收集环境中可用插件信息</text>

  <rect x="16" y="514" width="928" height="36" rx="10" fill="url(#footerBg)" filter="url(#shadow)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="359" y="537" text-anchor="end" fill="#1e40af" font-size="14" font-weight="bold">面向昇腾NPU</text>
  <circle cx="374" cy="532" r="2.5" fill="#94a3b8"/>
  <text x="452" y="537" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="bold">聚焦高效视频图片处理</text>
  <circle cx="530" cy="532" r="2.5" fill="#94a3b8"/>
  <text x="545" y="537" text-anchor="start" fill="#1e40af" font-size="14" font-weight="bold">覆盖解码推理编码全链路</text>
</svg>